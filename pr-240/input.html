  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Join the conversation · Live Caption</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="./input.css?v=7936e001" />
</head>
<body>
  <!-- A chat, because that is what it is: the room's speech arrives on the left,
       what you type goes to the big screen and comes back on the right. Seeing
       your own line land in the same timeline is the only honest answer to
       "did everyone see that?". -->
  <header class="app-header">
    <span class="mark" aria-hidden="true">◉</span>
    <div class="app-title">
      <h1>Conversation</h1>
      <section id="hostPresence" class="presence" data-state="connecting" aria-live="polite">
        <span class="presence-dot" aria-hidden="true"></span>
        <strong id="presenceTitle">Connecting to the conversation</strong>
        <span id="presenceDetail">Type a reply once connected</span>
      </section>
    </div>
    <span id="captionState" class="caption-state">Waiting for captions</span>
  </header>

  <main id="captionPanel" class="caption-panel" tabindex="0" aria-labelledby="captionTitle">
    <h2 id="captionTitle" class="sr-only">Live captions and your replies</h2>
    <p id="captionEmpty" class="caption-empty">Live captions will appear here when the host starts speaking.</p>
    <ol id="captionList" class="caption-list"></ol>
    <button id="captionToggle" class="caption-toggle" type="button" aria-controls="captionList" hidden>
      Back to latest
    </button>
  </main>

  <section id="roomNotice" class="room-notice" role="status" hidden>
    <p id="roomNoticeText"></p>
    <a href="./">Return to home</a>
  </section>

  <form id="messageForm" class="composer">
    <details class="participant-options">
      <summary>Name and input language <span>Optional</span></summary>
      <div class="option-fields">
        <label for="name">Display name</label>
        <input id="name" maxlength="30" autocomplete="name" placeholder="e.g. Jimmy" />

        <label for="language">Input language</label>
        <select id="language">
          <option value="auto" selected>Auto-detect</option>
          <option value="zh">Chinese</option>
          <option value="en">English</option>
        </select>
      </div>
    </details>

    <section id="lastSent" class="last-sent" aria-live="polite" hidden>
      <strong id="lastState">Delivering…</strong>
      <p id="lastText"></p>
    </section>

    <div class="composer-row">
      <label class="sr-only" for="message">Your reply</label>
      <!-- One line that grows: Enter sends, so a five-row box would be inviting
           a paragraph the return key is about to cut short. -->
      <textarea id="message" maxlength="200" rows="1" required
        enterkeyhint="send" placeholder="Type a reply… Enter to send"></textarea>
      <button id="sendBtn" type="submit" aria-label="Send reply">Send</button>
    </div>

    <div class="composer-foot">
      <span id="status" role="status" aria-live="polite">Connecting securely…</span>
      <span id="count">0 / 200</span>
    </div>
  </form>

  <script type="module" src="./input.js?v=7936e001"></script>
</body>
</html>
